# GitHub Pages serves the gh-pages branch. This copies main to gh-pages on
# every push, so committing to main is all it takes to update the live site.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
